<title>Macro Tracker</title>
<style>
/* Layout: one phone-frame app centered on a soft gradient; full-bleed below 520px. Screens: interview → plan → tracker. */
:root{
  --accent:#2563EB; --accent-2:#4F8BFF; --accent-soft:rgba(37,99,235,.10);
  --protein:#2563EB; --carbs:#14B8A6; --fat:#F59E0B; --water:#38BDF8;
  --over:#E5484D; --good:#16A34A;
  --bg:#EEF2F8; --backdrop-a:#E6ECF7; --backdrop-b:#F5F1FA;
  --screen:#F6F7FA; --card:#FFFFFF; --card-2:#F9FAFC; --fg:#0B0B0F; --fg-2:#5B6170; --fg-3:#9097A6;
  --line:rgba(15,23,42,.08); --track:rgba(15,23,42,.07); --bezel:#111216; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --glow:rgba(37,99,235,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050507; --backdrop-a:#0A0F1F; --backdrop-b:#120B1A;
  --screen:#0B0B0F; --card:#1A1A1F; --card-2:#202027; --fg:#F4F5F7; --fg-2:#A1A6B3; --fg-3:#6B7080;
  --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.08); --bezel:#2A2B31; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --accent-soft:rgba(79,139,255,.14); --glow:rgba(79,139,255,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050507; --backdrop-a:#0A0F1F; --backdrop-b:#120B1A;
  --screen:#0B0B0F; --card:#1A1A1F; --card-2:#202027; --fg:#F4F5F7; --fg-2:#A1A6B3; --fg-3:#6B7080;
  --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.08); --bezel:#2A2B31; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --accent-soft:rgba(79,139,255,.14); --glow:rgba(79,139,255,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 700px at 15% 10%,var(--backdrop-a),transparent 60%),radial-gradient(1000px 700px at 90% 90%,var(--backdrop-b),transparent 60%);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Device */
.device{width:400px;max-width:100%;height:860px;margin:0 auto;background:var(--bezel);border-radius:56px;padding:12px;box-shadow:0 40px 80px rgba(15,23,42,.25),0 0 0 1px rgba(255,255,255,.06) inset}
.screen{position:relative;height:100%;background:var(--screen);border-radius:44px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:600;font-size:15px;position:relative;z-index:3}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.batt{display:flex;align-items:center;gap:6px}
.batt i{display:inline-block;width:25px;height:12px;border:1.5px solid var(--fg);border-radius:4px;position:relative;opacity:.9}
.batt i::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--fg);border-radius:1.5px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:520px){
  body{padding-inline:0;padding-block:0;background:var(--screen)}
  .device{height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--screen)}
  .screen{border-radius:0}
  .statusbar{display:none}
}

/* Shared */
.pad{padding:8px 20px 28px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);background-image:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:600;font-size:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 20px var(--glow);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.ghost{background:var(--card-2);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px}
.link{background:none;border:0;color:var(--accent-2);font-weight:600;padding:6px 0}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg-2)}
.iconbtn svg{width:18px;height:18px}
.muted{color:var(--fg-2)}
.tiny{font-size:12px;color:var(--fg-3);line-height:1.45}
.toast{position:absolute;left:16px;right:16px;bottom:22px;z-index:20;background:var(--fg);color:var(--screen);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:none}

/* Interview */
.progress{height:4px;margin:4px 20px 0;border-radius:4px;background:var(--track);overflow:hidden;flex:none}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .35s ease}
.iv{flex:1;display:flex;flex-direction:column;padding:26px 22px 26px;gap:18px;min-height:0}
.iv .q{font-size:27px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
.iv .help{font-size:14px;color:var(--fg-2);line-height:1.5;margin-top:-8px}
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:var(--shadow)}
.field input,.field textarea{flex:1;min-width:0;border:0;background:transparent;font-size:20px;padding:12px 0;outline:none}
.field textarea{font-size:16px;resize:none;min-height:110px}
.field .unit{color:var(--fg-3);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:border-color .15s,background .15s}
.choice strong{font-size:16px}
.choice span{font-size:13px;color:var(--fg-2)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;background:var(--track);border-radius:12px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ivnav{margin-top:auto;display:flex;gap:10px}
.ivnav .btn{flex:1}
.ivnav .btn.ghost{flex:0 0 auto;padding-inline:20px}
.hello{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.12}
.note{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13.5px;line-height:1.5;color:var(--fg-2)}
.err{color:var(--over);font-size:13px;min-height:18px}

/* Results */
.res-hero{text-align:center;padding:22px 18px}
.res-hero .big{font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 12px;font-size:15px}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;font-weight:700;text-align:right}
.macro3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mtile b{font-size:22px;letter-spacing:-.02em}
.mtile small{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
details.method summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.method summary::-webkit-details-marker{display:none}
details.method ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--fg-2);line-height:1.55}

/* Tracker header */
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 20px 0}
.thead h1{font-size:34px;letter-spacing:-.03em;font-weight:800}
.thead .date{color:var(--fg-2);font-size:15px;margin-top:2px}
.tools{display:flex;gap:8px}
.daynav{display:flex;margin:12px 20px 0;background:var(--track);border-radius:12px;padding:3px}
.daynav button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;font-size:14px;color:var(--fg-2)}
.daynav button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.daynav button:disabled{opacity:.35;cursor:default}

/* Calorie hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 18px 18px}
.ringwrap{position:relative;width:220px;height:220px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ringwrap .glow{filter:drop-shadow(0 0 10px var(--glow))}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt .n{font-family:var(--font-display);font-size:50px;font-weight:800;letter-spacing:-.045em;line-height:1}
.ringtxt .of{font-size:14px;color:var(--fg-2);margin-top:6px}
.leftpill{margin-top:6px;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2)}
.leftpill.over{background:rgba(229,72,77,.12);color:var(--over)}
.arc{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.arc,.bar,.wfill{transition:none!important}}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mring .r{position:relative;width:78px;height:78px}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring .r span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mring .lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.mring .sub{font-size:12px;color:var(--fg-3)}

/* Water */
.water{display:flex;align-items:center;gap:14px}
.drop{width:42px;height:42px;border-radius:14px;background:rgba(56,189,248,.14);display:grid;place-items:center;color:var(--water);flex:none}
.water .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.water .top{display:flex;justify-content:space-between;font-size:14px}
.wbar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.wfill{height:100%;background:linear-gradient(90deg,#38BDF8,var(--accent-2));border-radius:8px;transition:width .5s ease}
.stepper{display:flex;gap:6px}
.stepper button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card-2);font-size:18px;font-weight:600;display:grid;place-items:center}

/* Logger */
.logger{display:flex;flex-direction:column;gap:10px}
.logger textarea{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:12px 14px;font-size:15px;resize:none;min-height:64px;outline:none}
.logger textarea:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lrow{display:flex;gap:8px;align-items:center}
.lrow .btn{flex:1}
.photo-thumb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2)}
.photo-thumb img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.preview{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.pitem .nm{flex:1;min-width:0}
.pitem .nm small{display:block;color:var(--fg-3);font-size:12px}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.manual input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
.manual .wide{grid-column:1/-1}

/* History */
.hist svg{width:100%;height:auto;display:block}

/* Diary */
.meal{display:flex;flex-direction:column;gap:2px}
.meal + .meal{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.mhead{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.mhead svg{width:18px;height:18px;color:var(--fg-2)}
.mhead .k{margin-left:auto;color:var(--fg-2);font-weight:600;font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0}
.item .nm{flex:1;min-width:0}
.item .nm b{font-weight:600;font-size:14.5px;display:block;overflow-wrap:anywhere}
.item .nm small{color:var(--fg-3);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .k{font-weight:700;font-size:14.5px}
.x{width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--fg-3);display:grid;place-items:center;flex:none}
.x:hover{background:var(--track);color:var(--over)}
.empty{font-size:13px;color:var(--fg-3);padding:6px 0 2px}

/* Backup */
details.backup summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.backup summary::-webkit-details-marker{display:none}
details.backup .chev{transition:transform .2s}
details.backup[open] .chev{transform:rotate(180deg)}
.bk{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bk textarea{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:none;height:70px;outline:none}
.footer{font-size:11.5px;color:var(--fg-3);text-align:center;line-height:1.5;padding:4px 10px 10px}

/* Sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--screen);border-radius:28px 28px 0 0;padding:10px 20px 28px;max-height:86%;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--track);margin:0 auto 4px}
.sync{font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.sync.on i{background:var(--good)}
</style>

<div class="device">
  <div class="screen" id="screen">
    <div class="statusbar"><span class="num" id="clock">9:41</span><span class="island"></span><span class="batt"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><i></i></span></div>
    <div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(n);
const fmt = n => r0(n).toLocaleString("en-US");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const LB = 2.20462;
const pad2 = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dkey(new Date());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftKey = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ICON = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  drop: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s-7 7.6-7 12.5a7 7 0 0 0 14 0c0-4.9-7-12.5-7-12.5z"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  cam: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  Breakfast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 6V4M5 9l-1.4-1.4M19 9l1.4-1.4"/></svg>',
  Lunch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>',
  Dinner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  Snacks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-3-2-7 0-7 5s3 9 5 9c1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-9s-4-7-7-5zM12 7c0-2 1-4 3-4"/></svg>',
};
const MEALS = ["Breakfast", "Lunch", "Dinner", "Snacks"];
const mealByTime = () => { const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 15 ? "Lunch" : h < 17 ? "Snacks" : h < 22 ? "Dinner" : "Snacks"; };
const DISCLAIMER = "I'm an AI assistant, not a medical professional. Check with your primary care physician before starting any new diet.";

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }

/* ---------- plan math (Mifflin-St Jeor + standard multipliers) ---------- */
const ACT = {
  sedentary: { f: 1.2, label: "Sedentary", hint: "Desk job, little exercise", oz: 0.5 },
  light: { f: 1.375, label: "Lightly active", hint: "Light exercise 1–3 days a week", oz: 0.6 },
  moderate: { f: 1.55, label: "Moderately active", hint: "Exercise 3–5 days a week", oz: 0.7 },
  very: { f: 1.725, label: "Very active", hint: "Hard exercise 6–7 days a week", oz: 0.85 },
  athlete: { f: 1.9, label: "Athlete", hint: "Training twice a day or a physical job", oz: 1.0 },
};
const PACE = {
  gentle: { label: "Gentle", hint: "Slow and easy to sustain", lose: 250, gain: 250 },
  steady: { label: "Steady", hint: "The sweet spot for most people", lose: 500, gain: 325 },
  aggressive: { label: "Aggressive", hint: "Faster, takes more discipline", lose: 750, gain: 400 },
};
const STYLE = {
  none: "No preference", highprotein: "High-protein", lowcarb: "Low-carb", keto: "Keto", vegetarian: "Vegetarian", vegan: "Vegan",
};

function computePlan(p) {
  const kg = p.weightKg, cm = p.heightCm, lb = kg * LB;
  const male = p.sex === "male";
  const bmr = 10 * kg + 6.25 * cm - 5 * p.age + (male ? 5 : -161);
  const tdee = bmr * ACT[p.activity].f;
  const floor = male ? 1500 : 1200;
  let target = tdee, floored = false;
  if (p.goal === "lose") {
    const deficit = Math.min(PACE[p.pace].lose, lb * 0.01 * 500); // never more than ~1% of bodyweight per week
    target = tdee - deficit;
    if (target < floor) { target = floor; floored = true; }
  } else if (p.goal === "gain") {
    target = tdee + PACE[p.pace].gain;
  }
  target = Math.round(target / 10) * 10;

  // Macros: protein & fat per lb (sports-nutrition guidelines), carbs fill the rest.
  const refLb = p.goal === "lose" && p.goalKg ? p.goalKg * LB : lb;
  let proteinPerLb = (p.goal === "lose" || p.activity === "athlete" || p.style === "highprotein") ? 1.0 : 0.8;
  let fatPerLb = 0.35;
  let protein = refLb * proteinPerLb, fat = refLb * fatPerLb, carbs;
  if (p.style === "keto") {
    carbs = 25; fat = Math.max(0, (target - protein * 4 - carbs * 4) / 9);
  } else if (p.style === "lowcarb") {
    carbs = Math.min(target * 0.25 / 4, Math.max(0, (target - protein * 4 - fat * 9) / 4));
    fat = Math.max(0, (target - protein * 4 - carbs * 4) / 9);
  } else {
    carbs = (target - protein * 4 - fat * 9) / 4;
    if (carbs < 50) { fat = refLb * 0.25; carbs = (target - protein * 4 - fat * 9) / 4; }
    if (carbs < 50) { protein = refLb * 0.8; carbs = (target - protein * 4 - fat * 9) / 4; }
    carbs = Math.max(0, carbs);
  }
  const waterL = lb * ACT[p.activity].oz * 0.0295735;

  let weeklyLb = null, weeks = null;
  if (p.goal !== "maintain" && p.goalKg) {
    const gap = Math.abs(tdee - target) * 7;
    weeklyLb = gap / 3500;
    const dist = Math.abs(lb - p.goalKg * LB);
    weeks = weeklyLb > 0.05 ? Math.round(dist / weeklyLb) : null;
  }
  return {
    bmr: r0(bmr), tdee: r0(tdee), kcal: target, floored,
    protein: r0(protein), carbs: r0(carbs), fat: r0(fat),
    waterL: Math.round(waterL * 10) / 10, weeklyLb, weeks, created: todayKey(),
  };
}

/* ---------- state & storage ---------- */
const LS_KEY = "macro-tracker-v1";
let S = { profile: null, plan: null, days: {} };
let ui = { view: "loading", step: 0, draft: {}, day: todayKey(), meal: mealByTime(), photo: null, preview: null, busy: false, manual: false, lastCal: 0 };
let sample = null, imagesOk = false, db = null, coll = null, synced = false;

function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} }
const dayOf = k => (S.days[k] ||= { items: [], water: 0 });

const pendingWrites = new Map();
function persist(kind, key) {
  saveLocal();
  if (!coll) return;
  const id = kind === "profile" ? "profile" : "day_" + key;
  clearTimeout(pendingWrites.get(id));
  pendingWrites.set(id, setTimeout(async () => {
    pendingWrites.delete(id);
    try {
      if (kind === "profile") await coll.doc("profile").set({ profile: S.profile, plan: S.plan });
      else await coll.doc(id).set({ date: key, items: dayOf(key).items, water: dayOf(key).water });
    } catch (e) { synced = false; renderSync(); }
  }, 600));
}
function persistAll() {
  persist("profile");
  Object.keys(S.days).forEach(k => persist("day", k));
}

async function connectDb() {
  if (!window.claude?.use) return;
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    db = d; coll = db.collection("data/users/" + id);
    const snap = await coll.get();
    const remote = { profile: null, plan: null, days: {} };
    snap.docs.forEach(doc => {
      const v = doc.data() || {};
      if (doc.id === "profile") { remote.profile = v.profile || null; remote.plan = v.plan || null; }
      else if (doc.id.startsWith("day_") && v.date) remote.days[v.date] = { items: v.items || [], water: v.water || 0 };
    });
    synced = true;
    if (remote.profile) {
      // Account copy wins; keep any local-only days.
      for (const [k, v] of Object.entries(S.days)) if (!remote.days[k] && v.items.length) remote.days[k] = v;
      S = remote; saveLocal();
      if (ui.view === "welcome" || ui.view === "loading") ui.view = "tracker";
      render();
    } else if (S.profile) {
      persistAll(); render();
    } else renderSync();
  } catch { coll = null; synced = false; renderSync(); }
}
async function connectSample() {
  if (!window.claude?.use) return;
  try {
    sample = await claude.use("sample");
    if (sample) { const lim = await sample.limits().catch(() => null); imagesOk = !!lim?.images; }
  } catch { sample = null; }
  if (ui.view === "tracker") render();
}

/* ---------- interview ---------- */
const STEPS = [
  { id: "name", q: "What's your first name?", type: "text", ph: "First name" },
  { id: "age", q: "How old are you?", help: "Age changes how many calories your body burns at rest.", type: "num", unit: "years", min: 14, max: 100 },
  { id: "sex", q: "What's your biological sex?", help: "Only used for the metabolic math. Bodies burn energy a little differently.", type: "choice", options: [["male", "Male"], ["female", "Female"]] },
  { id: "height", q: "How tall are you?", type: "height" },
  { id: "weight", q: "What do you weigh right now?", help: "Your best guess is fine. You can update it any time.", type: "weight", key: "weightKg" },
  { id: "goal", q: "What's your goal?", type: "choice", options: [["lose", "Lose weight", "Burn fat at a pace you can keep"], ["maintain", "Maintain", "Stay where you are, eat with intent"], ["gain", "Gain weight", "Build size and strength"]] },
  { id: "goalWeight", q: "What's your goal weight?", help: "Used for your estimated timeline.", type: "weight", key: "goalKg", skip: d => d.goal === "maintain" },
  { id: "activity", q: "How active are you on a normal week?", type: "choice", options: Object.entries(ACT).map(([k, v]) => [k, v.label, v.hint]) },
  { id: "pace", q: "How fast do you want results?", type: "choice", skip: d => d.goal === "maintain", options: Object.entries(PACE).map(([k, v]) => [k, v.label, v.hint]) },
  { id: "style", q: "Any eating style?", type: "choice", options: Object.entries(STYLE).map(([k, v]) => [k, v]) },
  { id: "notes", q: "Foods to avoid or health notes?", help: "Optional. Allergies, dislikes, conditions. I'll keep them in mind when estimating.", type: "area" },
];
const visibleSteps = () => STEPS.filter(s => !(s.skip && s.skip(ui.draft)));

function startInterview(prefill) {
  ui.draft = prefill ? { ...prefill } : { units: "imperial" };
  ui.step = 0; ui.view = prefill ? "step" : "welcome"; render();
}

function renderWelcome() {
  return `<div class="progress"><b style="width:0%"></b></div>
  <div class="iv">
    <div style="font-size:44px;line-height:1" aria-hidden="true">👋</div>
    <div class="hello">Hi! I'm your nutrition coach. Let's get your plan dialed in. 💪</div>
    <div class="note">Quick note before we start: I'm an AI assistant, not a medical professional. Check with your primary care physician before starting any new diet or making changes for a medical or dietary condition.</div>
    <p class="muted" style="margin:0;font-size:15px;line-height:1.55">To kick things off, I'd love to ask you a few quick questions so I can get to know you and build a plan that actually fits.</p>
    <p class="tiny" style="margin:0">11 questions · about 2 minutes · you don't need to know any numbers</p>
    <div class="ivnav"><button class="btn" id="go">Start</button></div>
  </div>`;
}

function unitSeg() {
  const u = ui.draft.units;
  return `<div class="seg" role="group" aria-label="Units"><button data-units="imperial" aria-pressed="${u === "imperial"}">ft · lb</button><button data-units="metric" aria-pressed="${u === "metric"}">cm · kg</button></div>`;
}
function renderStep() {
  const steps = visibleSteps(); const s = steps[ui.step]; const d = ui.draft;
  const pct = ((ui.step) / steps.length) * 100;
  let body = "";
  if (s.type === "text") body = `<label class="field"><input id="f-in" type="text" autocomplete="given-name" placeholder="${s.ph}" value="${esc(d.name || "")}"></label>`;
  if (s.type === "num") body = `<label class="field"><input id="f-in" type="number" inputmode="numeric" min="${s.min}" max="${s.max}" value="${esc(d[s.id] ?? "")}"><span class="unit">${s.unit}</span></label>`;
  if (s.type === "area") body = `<label class="field" style="align-items:flex-start"><textarea id="f-in" placeholder="e.g. lactose intolerant, no shellfish, type 2 diabetes">${esc(d.notes || "")}</textarea></label>`;
  if (s.type === "choice") body = `<div class="choices" role="radiogroup">${s.options.map(([v, l, h]) => `<button class="choice" data-val="${v}" aria-pressed="${d[s.id] === v}"><strong>${l}</strong>${h ? `<span>${h}</span>` : ""}</button>`).join("")}</div>`;
  if (s.type === "height") {
    const cm = d.heightCm;
    body = unitSeg() + (d.units === "imperial"
      ? `<div class="row2"><label class="field"><input id="f-ft" type="number" inputmode="numeric" min="3" max="8" value="${cm ? Math.floor(cm / 30.48) : ""}"><span class="unit">ft</span></label><label class="field"><input id="f-inch" type="number" inputmode="numeric" min="0" max="11" value="${cm ? r0((cm / 2.54) % 12) % 12 : ""}"><span class="unit">in</span></label></div>`
      : `<label class="field"><input id="f-in" type="number" inputmode="numeric" min="120" max="230" value="${cm ? r0(cm) : ""}"><span class="unit">cm</span></label>`);
  }
  if (s.type === "weight") {
    const kg = d[s.key];
    const v = kg ? (d.units === "imperial" ? r0(kg * LB) : Math.round(kg * 10) / 10) : "";
    body = unitSeg() + `<label class="field"><input id="f-in" type="number" inputmode="decimal" value="${v}"><span class="unit">${d.units === "imperial" ? "lb" : "kg"}</span></label>`;
  }
  return `<div class="progress"><b style="width:${pct}%"></b></div>
  <div class="iv">
    <div class="eyebrow">Question ${ui.step + 1} of ${steps.length}</div>
    <h2 class="q">${s.q}</h2>
    ${s.help ? `<div class="help">${s.help}</div>` : ""}
    ${body}
    <div class="err" id="err"></div>
    <div class="ivnav">
      <button class="btn ghost" id="back">Back</button>
      <button class="btn" id="next">${ui.step === steps.length - 1 ? "See my plan" : "Next"}</button>
    </div>
  </div>`;
}

function readStep() {
  const steps = visibleSteps(); const s = steps[ui.step]; const d = ui.draft; const val = id => $(id)?.value?.trim();
  const fail = m => { $("#err").textContent = m; return false; };
  if (s.type === "text") { if (!val("#f-in")) return fail("Add your first name to continue."); d.name = val("#f-in").slice(0, 40); }
  if (s.type === "num") { const n = Number(val("#f-in")); if (!n || n < s.min || n > s.max) return fail(`Enter an age between ${s.min} and ${s.max}.`); d.age = n; }
  if (s.type === "area") d.notes = (val("#f-in") || "").slice(0, 400);
  if (s.type === "choice") { if (!d[s.id]) return fail("Pick one to continue."); }
  if (s.type === "height") {
    let cm;
    if (d.units === "imperial") { const ft = Number(val("#f-ft")), inch = Number(val("#f-inch") || 0); cm = (ft * 12 + inch) * 2.54; }
    else cm = Number(val("#f-in"));
    if (!cm || cm < 120 || cm > 230) return fail("Enter a height between 4 ft and 7 ft 6 in (120–230 cm).");
    d.heightCm = cm;
  }
  if (s.type === "weight") {
    const n = Number(val("#f-in")); const kg = d.units === "imperial" ? n / LB : n;
    if (!n || kg < 35 || kg > 300) return fail("Enter a weight between 80 and 660 lb (35–300 kg).");
    if (s.key === "goalKg") {
      if (d.goal === "lose" && kg >= d.weightKg) return fail("For weight loss, the goal should be below your current weight.");
      if (d.goal === "gain" && kg <= d.weightKg) return fail("For weight gain, the goal should be above your current weight.");
    }
    d[s.key] = kg;
  }
  return true;
}

function renderResults() {
  const d = ui.draft; const p = computePlan(d);
  const imp = d.units === "imperial";
  const w = kg => imp ? `${r0(kg * LB)} lb` : `${Math.round(kg * 10) / 10} kg`;
  const rate = p.weeklyLb != null ? (imp ? `${p.weeklyLb.toFixed(1)} lb` : `${(p.weeklyLb / LB).toFixed(2)} kg`) : "";
  const pctBw = p.weeklyLb != null ? (p.weeklyLb / (d.weightKg * LB) * 100).toFixed(1) : null;
  const timeline = d.goal === "maintain" ? "" : (p.weeks ? `<dt>Time to ${w(d.goalKg)}</dt><dd class="num">~${p.weeks} weeks</dd><dt>Pace</dt><dd class="num">${rate} / week</dd>` : `<dt>Timeline</dt><dd>Not shown</dd>`);
  const why = d.goal === "lose" ? `About ${pctBw}% of your bodyweight per week, inside the 0.5–1% range that protects muscle and keeps energy steady.${p.floored ? ` Your target is held at the ${d.sex === "male" ? "1,500" : "1,200"} calorie safety floor.` : ""}`
    : d.goal === "gain" ? `A modest surplus of about ${r0(p.kcal - p.tdee)} calories favors muscle over fat gain.`
    : "Eating at maintenance keeps your weight stable while you build consistent habits.";
  return `<div class="progress"><b style="width:100%"></b></div>
  <div class="scroll"><div class="pad" style="padding-top:20px">
    <div><div class="eyebrow">Your plan</div><h2 style="font-size:26px;letter-spacing:-.02em;margin-top:4px">Here's your plan, ${esc(d.name)}.</h2></div>
    <div class="card res-hero"><div class="big num">${fmt(p.kcal)}</div><div class="muted" style="margin-top:6px">calories per day</div></div>
    <div class="macro3">
      ${[["Protein", p.protein, "--protein"], ["Carbs", p.carbs, "--carbs"], ["Fat", p.fat, "--fat"]].map(([l, g, c]) => `<div class="mtile"><small><span class="dot" style="background:var(${c})"></span>${l}</small><b class="num">${g}g</b><small class="num">${fmt(g * (l === "Fat" ? 9 : 4))} cal</small></div>`).join("")}
    </div>
    <div class="card"><dl class="kv" style="margin:0">
      <dt>BMR (calories at rest)</dt><dd class="num">${fmt(p.bmr)}</dd>
      <dt>TDEE (with activity)</dt><dd class="num">${fmt(p.tdee)}</dd>
      <dt>Daily target</dt><dd class="num">${fmt(p.kcal)}</dd>
      <dt>Water</dt><dd class="num">${p.waterL} L</dd>
      ${timeline}
    </dl></div>
    <div class="note"><b style="color:var(--fg)">Why this pace is safe.</b> ${why}</div>
    <details class="card method"><summary>Methodology ${ICON.chev}</summary><ul>
      <li>BMR: Mifflin-St Jeor equation.</li>
      <li>TDEE: BMR × standard activity multiplier (${ACT[d.activity].f} for ${ACT[d.activity].label.toLowerCase()}).</li>
      <li>Timeline: ~3,500 kcal per pound of body weight.</li>
      <li>Protein ${d.goal === "lose" || d.activity === "athlete" || d.style === "highprotein" ? "1.0" : "0.8"} g/lb and fat ~0.35 g/lb from common sports-nutrition guidelines${d.goal === "lose" ? ", using goal weight as the reference" : ""}; carbs fill the remaining calories${d.style === "keto" ? " (capped at 25 g for keto)" : d.style === "lowcarb" ? " (capped at 25% of calories for low-carb)" : ""}.</li>
      <li>Water: ${ACT[d.activity].oz} oz per lb of bodyweight for your activity level.</li>
      <li>Calorie floor: never below 1,500 (men) or 1,200 (women).</li>
    </ul></details>
    <p class="tiny" style="margin:0">This is general guidance, not medical advice.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" id="confirm">Looks good</button>
      <button class="btn ghost" id="adjust">Adjust my answers</button>
    </div>
  </div></div>`;
}

/* ---------- tracker ---------- */
function totals(k) {
  const day = S.days[k] || { items: [], water: 0 };
  return day.items.reduce((t, i) => ({ kcal: t.kcal + i.kcal, p: t.p + i.p, c: t.c + i.c, f: t.f + i.f }), { kcal: 0, p: 0, c: 0, f: 0 });
}
function ring(size, stroke, frac, color, id) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle class="arc" ${id ? `id="${id}"` : ""} cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - clamp(frac, 0, 1))}"/>
  </svg>`;
}
function niceDate(k) {
  const d = parseKey(k), t = todayKey();
  const long = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const title = k === t ? "Today" : k === shiftKey(t, -1) ? "Yesterday" : d.toLocaleDateString("en-US", { weekday: "long" });
  return { title, long };
}
function histChart() {
  const P = S.plan, t = todayKey();
  const keys = [...Array(7)].map((_, i) => shiftKey(t, i - 6));
  const vals = keys.map(k => totals(k).kcal);
  const max = Math.max(P.kcal * 1.25, ...vals) || 1;
  const W = 340, H = 150, top = 14, bot = 24, left = 4, bw = 30, gap = (W - left * 2 - bw * 7) / 6;
  const y = v => top + (H - top - bot) * (1 - v / max);
  const ty = y(P.kcal);
  const bars = keys.map((k, i) => {
    const x = left + i * (bw + gap), v = vals[i], h = Math.max(v ? 3 : 0, (H - bot) - y(v));
    const over = v > P.kcal * 1.05, sel = k === ui.day;
    const fill = v ? (over ? "var(--fat)" : "url(#hg)") : "var(--track)";
    const label = parseKey(k).toLocaleDateString("en-US", { weekday: "narrow" });
    return `<g><title>${parseKey(k).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}: ${fmt(v)} cal</title>
      <rect x="${x}" y="${top}" width="${bw}" height="${H - bot - top}" rx="9" fill="var(--track)" opacity=".5"/>
      <rect class="bar" x="${x}" y="${v ? H - bot - h : top}" width="${bw}" height="${v ? h : 0}" rx="9" fill="${fill}"/>
      ${v ? `<text x="${x + bw / 2}" y="${Math.max(top + 10, H - bot - h - 5)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--fg-2)" class="num">${v >= 1000 ? (v / 1000).toFixed(1) + "k" : r0(v)}</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" font-weight="${sel ? 700 : 500}" fill="${sel ? "var(--fg)" : "var(--fg-3)"}">${label}</text></g>`;
  }).join("");
  const days = vals.filter(v => v > 0); const avg = days.length ? days.reduce((a, b) => a + b, 0) / days.length : 0;
  const onTarget = vals.filter(v => v > 0 && Math.abs(v - P.kcal) <= P.kcal * 0.1).length;
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
      <h3 style="font-size:17px">Last 7 days</h3>
      <span class="tiny num">avg ${fmt(avg)} cal · ${onTarget}/7 within 10%</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily calories for the last 7 days versus target">
      <defs><linearGradient id="hg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#4F8BFF"/></linearGradient></defs>
      ${bars}
      <line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--fg-2)" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>
      <text x="${W}" y="${ty - 4}" text-anchor="end" font-size="9.5" fill="var(--fg-2)" class="num">target ${fmt(P.kcal)}</text>
    </svg>`;
}

  return `<div class="card logger">

    ${can && !ui.manual ? `
      <textarea id="food-text" rows="2" placeholder="2 eggs, toast with butter, black coffee" ${ui.busy ? "disabled" : ""}>${esc(ui.draftText || "")}</textarea>
      ${ui.photo ? `<div class="photo-thumb"><img src="${ui.photo.url}" alt="Selected meal photo"><span style="flex:1">Photo attached</span><button class="x" id="rm-photo" aria-label="Remove photo">${ICON.x}</button></div>` : ""}
      <div class="lrow">
        ${imagesOk ? `<label class="iconbtn" style="width:48px;height:48px;border-radius:14px;cursor:pointer" title="Add a photo">${ICON.cam}<input id="photo" type="file" accept="image/*" capture="environment" hidden></label>` : ""}
        <button class="btn" id="estimate" ${ui.busy ? "disabled" : ""}>${ui.busy ? "Estimating…" : "Estimate & log"}</button>
        ${ui.busy ? `<button class="btn ghost small" id="stop">Stop</button>` : ""}
      </div>
      <div class="err" id="log-err" style="min-height:0"></div>
      ${prev ? `<div class="preview">
        ${prev.items.map((it, i) => `<div class="pitem"><div class="nm"><b>${esc(it.name)}</b><small>${esc(it.serving)} · P ${r0(it.p)} · C ${r0(it.c)} · F ${r0(it.f)}</small></div><b class="num">${fmt(it.kcal)}</b><button class="x" data-rmp="${i}" aria-label="Remove ${esc(it.name)}">${ICON.x}</button></div>`).join("")}
        ${prev.note ? `<div class="tiny">${esc(prev.note)}</div>` : ""}
        <div class="lrow"><button class="btn ghost small" id="discard">Discard</button><button class="btn small" id="commit" ${prev.items.length ? "" : "disabled"}>Add ${fmt(prev.items.reduce((a, b) => a + b.kcal, 0))} cal to ${ui.meal}</button></div>
      </div>` : ""}
    ` : `
      <div class="manual">
        <input class="wide" id="m-name" placeholder="Food name" aria-label="Food name">
        <input class="wide" id="m-serv" placeholder="Serving (e.g. 1 cup)" aria-label="Serving">
        <input id="m-kcal" type="number" inputmode="numeric" placeholder="Calories" aria-label="Calories">
        <input id="m-p" type="number" inputmode="decimal" placeholder="Protein g" aria-label="Protein grams">
        <input id="m-c" type="number" inputmode="decimal" placeholder="Carbs g" aria-label="Carbs grams">
        <input id="m-f" type="number" inputmode="decimal" placeholder="Fat g" aria-label="Fat grams">
      </div>
      <div class="lrow">${can ? `<button class="btn ghost small" id="cancel-manual">Use Claude</button>` : ""}<button class="btn small" id="add-manual">Add to ${ui.meal}</button></div>
      ${can ? "" : `<div class="tiny">Allow this page to use Claude to log meals by text or photo. Until then, add items manually.</div>`}
    `}
  </div>`;
}

function renderTracker() {
  const P = S.plan, k = ui.day, t = totals(k), day = S.days[k] || { items: [], water: 0 };
  const { title, long } = niceDate(k);
  const left = P.kcal - t.kcal, frac = t.kcal / P.kcal;
  const macro = (lbl, g, tgt, c) => `<div class="mring"><div class="r">${ring(78, 8, g / (tgt || 1), `var(${c})`)}<span class="num">${r0(g)}</span></div><div class="lbl"><span class="dot" style="background:var(${c})"></span>${lbl}</div><div class="sub num">of ${tgt}g</div></div>`;
  const isToday = k === todayKey();
  const waterGlasses = r0(day.water / 0.25);
  return `
  <div class="thead">
    <div><h1>${title}</h1><div class="date">${long}</div></div>
    <div class="tools">
      <button class="iconbtn" id="plan-btn" aria-label="My plan">${ICON.user}</button>
      <button class="iconbtn" id="theme-btn" aria-label="Switch to ${isDark() ? "light" : "dark"} mode">${isDark() ? ICON.sun : ICON.moon}</button>
    </div>
  </div>
  <div class="daynav" role="group" aria-label="Day">
    <button id="prev">‹ Prev</button>
    <button id="today" class="${isToday ? "on" : ""}">Today</button>
    <button id="nextday" ${isToday ? "disabled" : ""}>Next ›</button>
  </div>
  <div class="scroll" id="tscroll"><div class="pad" style="padding-top:14px">
    <div class="card hero">
      <div class="ringwrap">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#4F8BFF"/></linearGradient></defs>
          <circle cx="110" cy="110" r="96" fill="none" stroke="var(--track)" stroke-width="16"/>
          <circle class="arc glow" id="cal-arc" cx="110" cy="110" r="96" fill="none" stroke="${left < 0 ? "var(--over)" : "url(#cg)"}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 96}" stroke-dashoffset="${2 * Math.PI * 96 * (1 - clamp(ui.lastCal / P.kcal, 0, 1))}"/>
        </svg>
        <div class="ringtxt"><div class="n num" id="cal-num">${fmt(ui.lastCal)}</div><div class="of num">of ${fmt(P.kcal)} cal</div></div>
      </div>
      <div class="leftpill num ${left < 0 ? "over" : ""}">${left >= 0 ? `${fmt(left)} left` : `${fmt(-left)} over`}</div>
    </div>
    <div class="card macros">
      ${macro("Protein", t.p, P.protein, "--protein")}${macro("Carbs", t.c, P.carbs, "--carbs")}${macro("Fat", t.f, P.fat, "--fat")}
    </div>
    <div class="card water">
      <div class="drop">${ICON.drop}</div>
      <div class="mid"><div class="top"><b>Water</b><span class="muted num">${day.water.toFixed(2).replace(/0$/, "")} / ${P.waterL} L · ${waterGlasses} glass${waterGlasses === 1 ? "" : "es"}</span></div>
        <div class="wbar"><div class="wfill" style="width:${clamp(day.water / P.waterL, 0, 1) * 100}%"></div></div></div>
      <div class="stepper"><button id="w-minus" aria-label="Remove a glass of water">−</button><button id="w-plus" aria-label="Add a glass of water (250 ml)">+</button></div>
    </div>
    ${renderLogger()}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="font-size:17px">Diary</h3><button class="link" id="wrap" style="font-size:13px">Wrap the day</button></div>
      ${MEALS.map(m => {
        const items = day.items.filter(i => i.meal === m); const sum = items.reduce((a, b) => a + b.kcal, 0);
        return `<div class="meal"><div class="mhead">${ICON[m]}${m}<span class="k num">${sum ? fmt(sum) + " cal" : ""}</span></div>
          ${items.length ? items.map(i => `<div class="item"><div class="nm"><b>${esc(i.name)}</b><small><span>${esc(i.serving || "")}</span><span class="num"><span class="dot" style="background:var(--protein)"></span> ${r0(i.p)}g <span class="dot" style="background:var(--carbs)"></span> ${r0(i.c)}g <span class="dot" style="background:var(--fat)"></span> ${r0(i.f)}g</span></small></div><span class="k num">${fmt(i.kcal)}</span><button class="x" data-del="${i.id}" aria-label="Delete ${esc(i.name)}">${ICON.x}</button></div>`).join("")
            : `<div class="empty">Nothing logged</div>`}</div>`;
      }).join("")}
    </div>
    <div class="card hist">${histChart()}</div>
    <details class="card backup" id="backup"><summary>Backup &amp; Restore ${ICON.chev}</summary>
      <div class="bk">
        <div class="sync ${synced ? "on" : ""}" id="sync"><i></i>${synced ? "Synced to your Claude account" : "Saved in this browser only"}</div>
        <button class="btn ghost small" id="copy-code">Copy save code</button>
        <textarea id="restore-in" placeholder="Paste a save code to restore" aria-label="Save code"></textarea>
        <button class="btn small" id="restore">Restore</button>
      </div>
    </details>
    <div class="footer">${DISCLAIMER}</div>
  </div></div>`;
}
function renderSync() { const el = $("#sync"); if (el) { el.className = "sync" + (synced ? " on" : ""); el.innerHTML = `<i></i>${synced ? "Synced to your Claude account" : "Saved in this browser only"}`; } }

function animateCalories() {
  const P = S.plan; if (!P) return;
  const target = totals(ui.day).kcal, from = ui.lastCal;
  const arc = $("#cal-arc"), num = $("#cal-num"); if (!arc || !num) return;
  const C = 2 * Math.PI * 96;
  requestAnimationFrame(() => { arc.style.strokeDashoffset = C * (1 - clamp(target / P.kcal, 0, 1)); });
  if (from === target || matchMedia("(prefers-reduced-motion: reduce)").matches) { num.textContent = fmt(target); ui.lastCal = target; return; }
  const t0 = performance.now(), dur = 800;
  const step = now => {
    const p = clamp((now - t0) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
    num.textContent = fmt(from + (target - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  ui.lastCal = target;
}

/* ---------- Claude food estimate ---------- */
let estCtl = null;
async function estimate() {
  const text = ($("#food-text")?.value || "").trim();
  ui.draftText = text;
  if (!text && !ui.photo) { $("#log-err").textContent = "Describe what you ate or attach a photo."; return; }
  const pr = S.profile;
  const prompt = `You are a nutrition estimator for a calorie tracker. Estimate calories and macros for the food below.
Rules:
- Be decisive: one best number per item, never a range.
- Use standard USDA FoodData Central-style reference values for whole foods. For branded, packaged or restaurant items, use the brand's published nutrition facts as you know them and name the source in "note".
- Split the meal into separate items with a realistic serving for each. If a quantity is not given, assume a typical single serving and say so briefly in "note".
${ui.photo ? "- A photo of the meal is attached. Identify each food and estimate portion sizes from the photo. If anything is ambiguous, assume reasonably and say so in one line in \"note\"." : ""}
- Calories should roughly equal protein*4 + carbs*4 + fat*9.
${pr?.notes ? `- The person's notes (for context only): ${pr.notes.slice(0, 300)}` : ""}
Reply with only JSON in this shape:
{"items":[{"name":"Scrambled eggs","serving":"2 large","kcal":182,"protein":12.6,"carbs":1.4,"fat":13.8}],"note":"one short line or empty"}

Meal (${ui.meal}): ${text || "(see photo)"}`;
  estCtl = new AbortController();
  ui.busy = true; ui.preview = null; render();
  try {
    const opts = { signal: estCtl.signal };
    if (ui.photo) opts.images = [ui.photo.file];
    const res = await sample.json(prompt, opts);
    const items = (Array.isArray(res?.items) ? res.items : []).map(it => ({
      name: String(it.name || "Item").slice(0, 80), serving: String(it.serving || "").slice(0, 40),
      kcal: Math.max(0, Number(it.kcal) || 0), p: Math.max(0, Number(it.protein) || 0), c: Math.max(0, Number(it.carbs) || 0), f: Math.max(0, Number(it.fat) || 0),
    })).filter(it => it.kcal > 0 || it.p || it.c || it.f);
    if (!items.length) throw { code: "empty" };
    ui.preview = { items, note: String(res.note || "").slice(0, 200), src: ui.photo ? "photo" : "text" };
  } catch (e) {
    const msg = {
      cancelled: "", not_granted: "This page isn't allowed to use Claude. Add items manually instead.",
      sampling_disabled: "Claude isn't available on this account. Add items manually instead.",
      rate_limited: "You've hit a usage limit. Try again in a little while.", image_rejected: "That photo couldn't be read. Try a JPEG or PNG under 20 MB.",
      images_unavailable: "Photos aren't supported here. Describe the meal in text.", session_expired: "Sign in to Claude again, then retry.",
      invalid_json: "Claude's answer couldn't be read. Try again or rephrase.", empty: "Couldn't find any food in that. Try describing it differently.",
    }[e?.code] ?? "Something went wrong reaching Claude. Try again.";
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(e?.code)) { sample = null; }
    if (e?.code === "images_unavailable") { imagesOk = false; ui.photo = null; }
    ui.busy = false; render(); if (msg) { const el = $("#log-err"); if (el) el.textContent = msg; else toast(msg); }
    return;
  }
  ui.busy = false; render();
}
function commitPreview() {
  const day = dayOf(ui.day);
  ui.preview.items.forEach(it => day.items.push({ id: uid(), meal: ui.meal, ...it, src: ui.preview.src, at: Date.now() }));
  const n = ui.preview.items.length, kc = ui.preview.items.reduce((a, b) => a + b.kcal, 0);
  ui.preview = null; ui.draftText = ""; if (ui.photo) { URL.revokeObjectURL(ui.photo.url); ui.photo = null; }
  persist("day", ui.day); render();
  toast(`Logged ${n} item${n === 1 ? "" : "s"} · ${fmt(kc)} cal to ${ui.meal}`);
}

/* ---------- save code ---------- */
const encodeSave = () => "MT1." + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decodeSave(code) {
  const raw = code.trim().replace(/^MT1\./, "");
  const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
  if (!obj || !obj.plan || !obj.profile || typeof obj.days !== "object") throw new Error("bad");
  return obj;
}

/* ---------- sheets ---------- */
function openSheet(html, bind) {
  const sh = $("#sheet"); sh.innerHTML = `<div class="grab"></div>${html}`;
  $("#scrim").classList.add("on"); sh.classList.add("on"); bind?.(sh);
}
function closeSheet() { $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#scrim").addEventListener("click", closeSheet);

function planSheet() {
  const P = S.plan, pr = S.profile, imp = pr.units === "imperial";
  const w = kg => imp ? `${r0(kg * LB)} lb` : `${Math.round(kg * 10) / 10} kg`;
  const goal = { lose: "Lose weight", maintain: "Maintain", gain: "Gain weight" }[pr.goal];
  openSheet(`<div><div class="eyebrow">My plan · set ${parseKey(P.created).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div><h2 style="font-size:24px;margin-top:4px">${esc(pr.name)}'s targets</h2></div>
    <div class="card"><dl class="kv" style="margin:0">
      <dt>Goal</dt><dd>${goal}${pr.goal !== "maintain" ? ` · ${w(pr.weightKg)} → ${w(pr.goalKg)}` : ""}</dd>
      <dt>Daily calories</dt><dd class="num">${fmt(P.kcal)}</dd>
      <dt>Protein · Carbs · Fat</dt><dd class="num">${P.protein} · ${P.carbs} · ${P.fat} g</dd>
      <dt>Water</dt><dd class="num">${P.waterL} L</dd>
      <dt>BMR · TDEE</dt><dd class="num">${fmt(P.bmr)} · ${fmt(P.tdee)}</dd>
      ${P.weeks ? `<dt>Estimated timeline</dt><dd class="num">~${P.weeks} weeks</dd>` : ""}
    </dl></div>
    <button class="btn ghost" id="redo">Update weight or redo setup</button>
    <button class="btn" id="close-sheet">Done</button>
    <p class="tiny" style="margin:0">${DISCLAIMER}</p>`, sh => {
    $("#close-sheet", sh).onclick = closeSheet;
    $("#redo", sh).onclick = () => { closeSheet(); startInterview({ ...S.profile }); };
  });
}
function wrapSheet() {
  const P = S.plan, k = ui.day, t = totals(k), day = S.days[k] || { items: [], water: 0 };
  const diff = t.kcal - P.kcal;
  const line = `${niceDate(k).title}: ${fmt(t.kcal)} / ${fmt(P.kcal)} cal (${diff > 0 ? "+" : ""}${fmt(diff)}) · P ${r0(t.p)}/${P.protein}g · C ${r0(t.c)}/${P.carbs}g · F ${r0(t.f)}/${P.fat}g · Water ${day.water.toFixed(1)}/${P.waterL} L`;
  const proteinHit = t.p >= P.protein * 0.9;
  const verdict = !day.items.length ? "Nothing logged yet for this day."
    : Math.abs(diff) <= P.kcal * 0.1 ? `Within 10% of target${proteinHit ? " and protein on point" : ""}. Solid day.`
    : diff < 0 ? `${fmt(-diff)} under target.${proteinHit ? " Protein was on point." : " Protein came in light; aim for a protein-forward first meal tomorrow."}`
    : `${fmt(diff)} over target. One day doesn't decide anything. Reset tomorrow.`;
  const code = encodeSave();
  openSheet(`<h2 style="font-size:24px">Day wrapped</h2>
    <div class="card num" style="font-size:14px;line-height:1.55">${esc(line)}</div>
    <p style="margin:0;font-size:15px">${verdict}</p>
    <label class="eyebrow" for="wrap-code">Your current save code</label>
    <div class="bk" style="margin:0"><textarea id="wrap-code" readonly>${code}</textarea></div>
    <button class="btn" id="wrap-copy">Copy save code</button>
    <button class="btn ghost" id="close-sheet">Close</button>`, sh => {
    $("#wrap-copy", sh).onclick = () => copyText(code, $("#wrap-code", sh));
    $("#close-sheet", sh).onclick = closeSheet;
  });
}

/* ---------- render & events ---------- */
function render() {
  const app = $("#app");
  const scrollTop = $("#tscroll")?.scrollTop;
  const backupOpen = $("#backup")?.open;
  if (ui.view === "loading") { app.innerHTML = ""; return; }
  if (ui.view === "welcome") app.innerHTML = renderWelcome();
  else if (ui.view === "step") app.innerHTML = renderStep();
  else if (ui.view === "results") app.innerHTML = renderResults();
  else if (ui.view === "tracker") {
    app.innerHTML = renderTracker();
    if (scrollTop != null) $("#tscroll").scrollTop = scrollTop;
    if (backupOpen) $("#backup").open = true;
    animateCalories();
  }
  bind();
}

function bind() {
  const on = (sel, fn, ev = "click") => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  if (ui.view === "welcome") on("#go", () => { ui.view = "step"; ui.step = 0; render(); });
  if (ui.view === "step") {
    const steps = visibleSteps(), s = steps[ui.step];
    const next = () => {
      if (!readStep()) return;
      if (ui.step >= visibleSteps().length - 1) { ui.view = "results"; render(); }
      else { ui.step++; render(); }
    };
    on("#next", next);
    on("#back", () => { if (ui.step === 0) { ui.view = S.plan ? "tracker" : "welcome"; } else ui.step--; render(); });
    document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
      ui.draft[s.id] = b.dataset.val;
      document.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#err").textContent = "";
      setTimeout(next, 180);
    }));
    document.querySelectorAll("[data-units]").forEach(b => b.addEventListener("click", () => {
      const keep = s.type === "weight" ? Number($("#f-in").value) : null;
      if (keep) ui.draft[s.key] = ui.draft.units === "imperial" ? keep / LB : keep;
      ui.draft.units = b.dataset.units; render();
    }));
    const first = $("#f-in") || $("#f-ft");
    if (first) { first.focus(); first.addEventListener("keydown", e => { if (e.key === "Enter" && first.tagName !== "TEXTAREA") next(); }); }
    $("#f-inch")?.addEventListener("keydown", e => { if (e.key === "Enter") next(); });
  }
  if (ui.view === "results") {
    on("#confirm", () => {
      S.profile = { ...ui.draft }; S.plan = computePlan(S.profile);
      persist("profile"); ui.view = "tracker"; ui.day = todayKey(); ui.lastCal = 0; render();
      toast(`Plan saved: ${fmt(S.plan.kcal)} cal a day`);
    });
    on("#adjust", () => { ui.view = "step"; ui.step = 0; render(); });
  }
  if (ui.view === "tracker") {
    on("#theme-btn", toggleTheme);
    on("#plan-btn", planSheet);
    on("#prev", () => { ui.day = shiftKey(ui.day, -1); ui.preview = null; render(); });
    on("#today", () => { ui.day = todayKey(); render(); });
    on("#nextday", () => { if (ui.day < todayKey()) { ui.day = shiftKey(ui.day, 1); render(); } });
    on("#w-plus", () => { const d = dayOf(ui.day); d.water = Math.round((d.water + 0.25) * 100) / 100; persist("day", ui.day); render(); });
    on("#w-minus", () => { const d = dayOf(ui.day); d.water = Math.max(0, Math.round((d.water - 0.25) * 100) / 100); persist("day", ui.day); render(); });
    document.querySelectorAll("[data-meal]").forEach(b => b.addEventListener("click", () => { ui.draftText = $("#food-text")?.value ?? ui.draftText; ui.meal = b.dataset.meal; render(); }));
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      const d = dayOf(ui.day); const idx = d.items.findIndex(i => i.id === b.dataset.del);
      if (idx < 0) return; const [gone] = d.items.splice(idx, 1);
      persist("day", ui.day); render(); toast(`Removed ${gone.name}`);
    }));
    on("#food-text", e => { ui.draftText = e.target.value; }, "input");
    on("#food-text", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); estimate(); } }, "keydown");
    on("#estimate", estimate);
    on("#stop", () => estCtl?.abort());
    on("#photo", e => {
      const f = e.target.files?.[0]; if (!f) return;
      if (ui.photo) URL.revokeObjectURL(ui.photo.url);
      ui.draftText = $("#food-text")?.value ?? ui.draftText;
      ui.photo = { file: f, url: URL.createObjectURL(f) }; render();
    }, "change");
    on("#rm-photo", () => { URL.revokeObjectURL(ui.photo.url); ui.photo = null; render(); });
    document.querySelectorAll("[data-rmp]").forEach(b => b.addEventListener("click", () => { ui.preview.items.splice(Number(b.dataset.rmp), 1); render(); }));
    on("#discard", () => { ui.preview = null; render(); });
    on("#commit", commitPreview);
    on("#toggle-manual", () => { ui.manual = true; render(); });
    on("#cancel-manual", () => { ui.manual = false; render(); });
    on("#add-manual", () => {
      const name = $("#m-name").value.trim(), kcal = Number($("#m-kcal").value);
      if (!name || !(kcal >= 0) || $("#m-kcal").value === "") { toast("Add a food name and calories"); return; }
      dayOf(ui.day).items.push({ id: uid(), meal: ui.meal, name: name.slice(0, 80), serving: $("#m-serv").value.trim().slice(0, 40), kcal, p: Number($("#m-p").value) || 0, c: Number($("#m-c").value) || 0, f: Number($("#m-f").value) || 0, src: "manual", at: Date.now() });
      persist("day", ui.day); render(); toast(`Logged ${name}`);
    });
    on("#wrap", wrapSheet);
    on("#copy-code", () => copyText(encodeSave(), null));
    on("#restore", () => {
      const v = $("#restore-in").value; if (!v.trim()) { toast("Paste a save code first"); return; }
      try { S = decodeSave(v); persistAll(); ui.day = todayKey(); ui.lastCal = 0; render(); toast("Restored"); }
      catch { toast("That save code isn't valid. Copy it again in full."); }
    });
  }
}

/* ---------- clock & day rollover ---------- */
let lastToday = todayKey();
function tick() {
  const now = new Date();
  $("#clock").textContent = now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M/, "");
  const t = todayKey();
  if (t !== lastToday) { const wasToday = ui.day === lastToday; lastToday = t; if (wasToday) { ui.day = t; ui.lastCal = 0; } if (ui.view === "tracker") render(); }
}
setInterval(tick, 15000); tick();

/* ---------- boot ---------- */
(function boot() {
  const local = loadLocal();
  if (local?.plan && local?.profile) { S = { profile: local.profile, plan: local.plan, days: local.days || {} }; ui.view = "tracker"; }
  else ui.view = "welcome";
  render();
  connectDb(); connectSample();
})();
</script>
