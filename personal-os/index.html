<title>Kişisel OS</title>
<style>
/* Layout: one phone-frame app on a soft gradient (full-bleed under 520px); five tabs in an iOS bottom bar. */
:root{
  --accent:#2563EB; --accent-2:#4F8BFF; --accent-soft:rgba(37,99,235,.10);
  --protein:#2563EB; --carbs:#14B8A6; --fat:#F59E0B; --water:#38BDF8; --mood:#8B5CF6; --pain:#E5484D; --smoke:#78716C;
  --over:#E5484D; --warn:#D97706; --good:#16A34A;
  --bg:#EEF2F8; --backdrop-a:#E6ECF7; --backdrop-b:#F5F1FA;
  --screen:#F6F7FA; --card:#FFFFFF; --card-2:#F4F6FA; --fg:#0B0B0F; --fg-2:#5B6170; --fg-3:#8E95A4;
  --line:rgba(15,23,42,.08); --track:rgba(15,23,42,.07); --bezel:#111216; --tabbar:rgba(255,255,255,.86);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06); --glow:rgba(37,99,235,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050507; --backdrop-a:#0A0F1F; --backdrop-b:#120B1A;
  --screen:#0B0B0F; --card:#1A1A1F; --card-2:#222229; --fg:#F4F5F7; --fg-2:#A1A6B3; --fg-3:#6E7383;
  --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.08); --bezel:#2A2B31; --tabbar:rgba(18,18,22,.88);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --accent-soft:rgba(79,139,255,.15); --glow:rgba(79,139,255,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050507; --backdrop-a:#0A0F1F; --backdrop-b:#120B1A;
  --screen:#0B0B0F; --card:#1A1A1F; --card-2:#222229; --fg:#F4F5F7; --fg-2:#A1A6B3; --fg-3:#6E7383;
  --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.08); --bezel:#2A2B31; --tabbar:rgba(18,18,22,.88);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --accent-soft:rgba(79,139,255,.15); --glow:rgba(79,139,255,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 700px at 15% 10%,var(--backdrop-a),transparent 60%),radial-gradient(1000px 700px at 90% 90%,var(--backdrop-b),transparent 60%);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Device */
.device{width:400px;max-width:100%;height:min(860px,calc(100dvh - 56px));min-height:620px;margin:0 auto;background:var(--bezel);border-radius:56px;padding:12px;box-shadow:0 40px 80px rgba(15,23,42,.25),0 0 0 1px rgba(255,255,255,.06) inset}
.screen{position:relative;height:100%;background:var(--screen);border-radius:44px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:600;font-size:15px;position:relative;z-index:3}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.batt{display:flex;align-items:center;gap:6px}
.batt i{display:inline-block;width:25px;height:12px;border:1.5px solid var(--fg);border-radius:4px;position:relative;opacity:.9}
.batt i::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--fg);border-radius:1.5px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:520px){
  body{padding-inline:0;padding-block:0;background:var(--screen)}
  .device{height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--screen)}
  .screen{border-radius:0}
  .statusbar{display:none}
}

/* Shared */
.pad{padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch h3{font-size:17px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 20px var(--glow);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.ghost{background:var(--card-2);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:9px 13px;font-size:13.5px;border-radius:11px}
.link{background:none;border:0;color:var(--accent-2);font-weight:600;padding:4px 0;font-size:13.5px}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg-2);flex:none}
.iconbtn svg{width:18px;height:18px}
.muted{color:var(--fg-2)}
.tiny{font-size:12px;color:var(--fg-3);line-height:1.45;margin:0}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:30;background:var(--fg);color:var(--screen);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(24px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility .3s}
.toast.show{transform:none;opacity:1;visibility:visible}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.err{color:var(--over);font-size:13px}
.err:empty{display:none}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:none}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .wide{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.35;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--track);color:var(--fg-2);white-space:nowrap}
.pill.good{background:rgba(22,163,74,.13);color:var(--good)}
.pill.warn{background:rgba(217,119,6,.14);color:var(--warn)}
.pill.bad{background:rgba(229,72,77,.13);color:var(--over)}
.pill.info{background:var(--accent-soft);color:var(--accent-2)}
.x{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--fg-3);display:grid;place-items:center;flex:none}
.x:hover{background:var(--track);color:var(--over)}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card-2);font-size:19px;font-weight:600;display:grid;place-items:center}
.big{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.unit{font-size:14px;font-weight:600;color:var(--fg-3);letter-spacing:0}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.bar b{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s ease}
.chart svg{width:100%;height:auto;display:block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat b{font-size:18px;letter-spacing:-.02em}
.stat small{font-size:11.5px;color:var(--fg-3)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.li .nm small{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--fg-3);font-size:12px;margin-top:1px}
.li .v{font-weight:700;font-size:14.5px;text-align:right}
.empty{font-size:13px;color:var(--fg-3);padding:4px 0}
pre.code{margin:0;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:var(--mono);font-size:11px;line-height:1.5;overflow-x:auto;max-height:220px;white-space:pre}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5;color:var(--fg-2)}
ol.steps b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Header & tabs */
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 16px 0;flex:none}
.thead h1{font-size:32px;letter-spacing:-.03em;font-weight:800}
.thead .date{color:var(--fg-2);font-size:14px;margin-top:2px}
.tools{display:flex;gap:8px}
.daynav{margin:10px 16px 0;flex:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--fg-3);padding:4px 0}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent-2)}

/* Today */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.tile .t svg{width:15px;height:15px}
.tile b{font-size:21px;letter-spacing:-.02em;font-family:var(--font-display)}
.tile small{font-size:11.5px;color:var(--fg-3)}
.score{display:grid;gap:4px}
.score button{border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:7px 0;font-size:13px;font-weight:700;color:var(--fg-2)}
.score button[aria-pressed="true"]{color:#fff;border-color:transparent}
.score.mood button[aria-pressed="true"]{background:var(--mood)}
.score.pain button[aria-pressed="true"]{background:var(--pain)}
.slots{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.qe-op{display:flex;gap:10px;align-items:center;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.qe-op input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.qe-op span{flex:1;min-width:0}
.qe-op small{color:var(--fg-3);font-size:11.5px;white-space:nowrap}

/* Nutrition */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px}
.ringwrap{position:relative;width:200px;height:200px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ringwrap .glow{filter:drop-shadow(0 0 10px var(--glow))}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt .n{font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1}
.ringtxt .of{font-size:13px;color:var(--fg-2);margin-top:6px}
.leftpill{font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2)}
.leftpill.over{background:rgba(229,72,77,.12);color:var(--over)}
.arc{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.calrow{display:flex;gap:14px;font-size:12.5px;color:var(--fg-2)}
.calrow b{color:var(--fg)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mring{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.mring .r{position:relative;width:74px;height:74px}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring .r span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px}
.mring .lbl{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.mring .sub{font-size:11.5px;color:var(--fg-3)}
.photo-thumb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2)}
.photo-thumb img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.mhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-top:6px}
.mhead .k{margin-left:auto;color:var(--fg-2);font-weight:600;font-size:13px}

/* Interview */
.progress{height:4px;margin:4px 20px 0;border-radius:4px;background:var(--track);overflow:hidden;flex:none}
.progress b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .35s ease}
.iv{flex:1;display:flex;flex-direction:column;padding:24px 20px;gap:16px;min-height:0;overflow-y:auto}
.iv .q{font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
.iv .help{font-size:14px;color:var(--fg-2);line-height:1.5;margin-top:-6px}
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:var(--shadow)}
.field input,.field textarea{flex:1;min-width:0;border:0;background:transparent;font-size:20px;padding:12px 0;outline:none}
.field textarea{font-size:16px;resize:none;min-height:100px}
.field .unit{font-size:15px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:13px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.choice strong{font-size:15.5px}
.choice span{font-size:13px;color:var(--fg-2)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ivnav{margin-top:auto;display:flex;gap:10px}
.ivnav .btn{flex:1}
.ivnav .btn.ghost{flex:0 0 auto;padding-inline:20px}
.note{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13.5px;line-height:1.5;color:var(--fg-2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;font-weight:700;text-align:right}
.grad{background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
details.fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
details.fold summary::-webkit-details-marker{display:none}
details.fold .chev{transition:transform .2s}
details.fold[open] .chev{transform:rotate(180deg)}
details.fold > div,details.fold > ul{margin-top:12px}

/* Sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--screen);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--track);margin:0 auto 2px;flex:none}
.footer{font-size:11px;color:var(--fg-3);text-align:center;line-height:1.5;padding:2px 10px 6px}
</style>

<div class="device">
  <div class="screen" id="screen">
    <div class="statusbar"><span class="num" id="clock">9:41</span><span class="island"></span><span class="batt"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><i></i></span></div>
    <div id="app"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
"use strict";
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(n);
const fmt = n => r0(n || 0).toLocaleString("tr-TR");
const fmt1 = n => (Math.round((n || 0) * 10) / 10).toLocaleString("tr-TR");
const TL = n => (Number(n) || 0).toLocaleString("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { const n = Number(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
const LB = 2.20462;
const pad2 = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dkey(new Date());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftKey = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const validKey = k => typeof k === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k) && !isNaN(parseKey(k)) ? k : null;
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const hm = m => { m = r0(m || 0); const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} sa ${mm ? mm + " dk" : ""}`.trim() : `${mm} dk`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const last7 = (end = todayKey()) => [...Array(7)].map((_, i) => shiftKey(end, i - 6));
const DISCLAIMER = "Ben bir yapay zekâ asistanıyım, sağlık profesyoneli değilim. Yeni bir diyete başlamadan önce doktoruna danış.";

const ICON = {

/* ================= nutrition plan math ================= */
const ACT = {
  sedentary: { f: 1.2, label: "Hareketsiz", hint: "Masa başı iş, az egzersiz", oz: 0.5 },
  light: { f: 1.375, label: "Hafif aktif", hint: "Haftada 1–3 gün hafif egzersiz", oz: 0.6 },
  moderate: { f: 1.55, label: "Orta aktif", hint: "Haftada 3–5 gün egzersiz", oz: 0.7 },
  very: { f: 1.725, label: "Çok aktif", hint: "Haftada 6–7 gün yoğun egzersiz", oz: 0.85 },
  athlete: { f: 1.9, label: "Sporcu", hint: "Günde iki antrenman ya da fiziksel iş", oz: 1.0 },
};
const PACE = {
  gentle: { label: "Yumuşak", hint: "Yavaş ve sürdürmesi kolay", lose: 250, gain: 250 },
  steady: { label: "Dengeli", hint: "Çoğu kişi için ideal", lose: 500, gain: 325 },
  aggressive: { label: "Agresif", hint: "Daha hızlı, daha çok disiplin ister", lose: 750, gain: 400 },
};
const STYLE = { none: "Tercih yok", highprotein: "Yüksek protein", lowcarb: "Düşük karbonhidrat", keto: "Keto", vegetarian: "Vejetaryen", vegan: "Vegan" };

function computePlan(p) {
  const kg = p.weightKg, cm = p.heightCm, lb = kg * LB, male = p.sex === "male";
  const bmr = 10 * kg + 6.25 * cm - 5 * p.age + (male ? 5 : -161);
  const tdee = bmr * ACT[p.activity].f;
  const floor = male ? 1500 : 1200;
  let target = tdee, floored = false;
  if (p.goal === "lose") {
    target = tdee - Math.min(PACE[p.pace].lose, lb * 0.01 * 500);
    if (target < floor) { target = floor; floored = true; }
  } else if (p.goal === "gain") target = tdee + PACE[p.pace].gain;
  target = Math.round(target / 10) * 10;
  const refLb = p.goal === "lose" && p.goalKg ? p.goalKg * LB : lb;
  const perLb = (p.goal === "lose" || p.activity === "athlete" || p.style === "highprotein") ? 1.0 : 0.8;
  let protein = refLb * perLb, fat = refLb * 0.35, carbs;
  if (p.style === "keto") { carbs = 25; fat = Math.max(0, (target - protein * 4 - carbs * 4) / 9); }
  else if (p.style === "lowcarb") {
    carbs = Math.min(target * 0.25 / 4, Math.max(0, (target - protein * 4 - fat * 9) / 4));
    fat = Math.max(0, (target - protein * 4 - carbs * 4) / 9);
  } else {
    carbs = (target - protein * 4 - fat * 9) / 4;
    if (carbs < 50) { fat = refLb * 0.25; carbs = (target - protein * 4 - fat * 9) / 4; }
    if (carbs < 50) { protein = refLb * 0.8; carbs = (target - protein * 4 - fat * 9) / 4; }
    carbs = Math.max(0, carbs);
  }
  let weeklyLb = null, weeks = null;
  if (p.goal !== "maintain" && p.goalKg) {
    weeklyLb = Math.abs(tdee - target) * 7 / 3500;
    weeks = weeklyLb > 0.05 ? Math.round(Math.abs(lb - p.goalKg * LB) / weeklyLb) : null;
  }
  return { bmr: r0(bmr), tdee: r0(tdee), kcal: target, floored, protein: r0(protein), carbs: r0(carbs), fat: r0(fat),
    waterL: Math.round(lb * ACT[p.activity].oz * 0.0295735 * 10) / 10, weeklyLb, weeks, created: todayKey() };
}

async function connectDb() {
  if (!window.claude?.use) return;

    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    coll = d.collection("data/users/" + id);
    const snap = await coll.get();
    const remote = { days: {} }; let any = false;
    snap.docs.forEach(doc => {
      const v = doc.data() || {}; any = true;
      if (doc.id === "profile") { remote.profile = v.profile; remote.plan = v.plan; remote.settings = v.settings; }
      else if (doc.id === "fin") remote.fin = v;
      else if (doc.id === "todos") remote.todos = v.items;
      else if (doc.id.startsWith("day_") && v.date) { const { date, ...rest } = v; remote.days[date] = rest; }
    });
    synced = true;
    if (any) {
      for (const [k, v] of Object.entries(S.days)) if (!remote.days[k]) remote.days[k] = v;
      remote.settings ||= S.settings; remote.fin ||= S.fin; remote.todos ||= S.todos;
      remote.profile ||= S.profile; remote.plan ||= S.plan;
      adopt(remote); saveLocal(); persistAll();

  } catch { coll = null; synced = false; }

function bars7({ keys, vals, target, color = "var(--accent)", fmtv = v => fmt(v), label, overBad = false, h = 130 }) {
  const W = 340, H = h, top = 16, bot = 22, bw = 30, gap = (W - bw * 7) / 6;
  const max = Math.max(target ? target * 1.2 : 0, ...vals.map(v => v || 0)) || 1;
  const y = v => top + (H - top - bot) * (1 - v / max);
  const bars = keys.map((k, i) => {
    const x = i * (bw + gap), v = vals[i] || 0, hh = v ? Math.max(3, (H - bot) - y(v)) : 0, sel = k === ui.day;
    const fill = v && target && overBad && v > target * 1.05 ? "var(--fat)" : color;
    const wd = parseKey(k).toLocaleDateString("tr-TR", { weekday: "short" }).slice(0, 2);
    return `<g><title>${parseKey(k).toLocaleDateString("tr-TR", { day: "numeric", month: "short", weekday: "short" })}: ${v ? fmtv(v) : "kayıt yok"}</title>
      <rect x="${x}" y="${top}" width="${bw}" height="${H - bot - top}" rx="8" fill="var(--track)" opacity=".55"/>
      ${v ? `<rect x="${x}" y="${H - bot - hh}" width="${bw}" height="${hh}" rx="8" fill="${fill}"/>
      <text x="${x + bw / 2}" y="${Math.max(top - 3, H - bot - hh - 4)}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--fg-2)" class="num">${fmtv(v)}</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" font-weight="${sel ? 700 : 500}" fill="${sel ? "var(--fg)" : "var(--fg-3)"}">${wd}</text></g>`;
  }).join("");
  const ty = target ? y(target) : null;
  return `<svg viewBox="0 -4 ${W} ${H + 4}" role="img" aria-label="${esc(label)}">${bars}
    ${target ? `<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--fg-2)" stroke-dasharray="3 4" opacity=".6"/>` : ""}</svg>`;
}
function lines7({ keys, series, max = 10, label }) {
  const W = 340, H = 130, top = 10, bot = 22, left = 18, step = (W - left - 10) / 6;
  const y = v => top + (H - top - bot) * (1 - v / max), x = i => left + i * step;
  const grid = [0, 5, 10].map(g => `<line x1="${left}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="0" y="${y(g) + 3}" font-size="9" fill="var(--fg-3)" class="num">${g}</text>`).join("");
  const paths = series.map(s => {
    let d = "", pen = false;
    s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i)},${y(v)}`; pen = true; });
    const dots = s.vals.map((v, i) => v == null ? "" : `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"><title>${s.name}: ${fmt1(v)}</title></circle>`).join("");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");
  const labels = keys.map((k, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="${k === ui.day ? "var(--fg)" : "var(--fg-3)"}" font-weight="${k === ui.day ? 700 : 500}">${parseKey(k).toLocaleDateString("tr-TR", { weekday: "short" }).slice(0, 2)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}${paths}${labels}</svg>`;
}
function ring(size, stroke, frac, color) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle class="arc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - clamp(frac, 0, 1))}"/></svg>`;
}

}

/* ================= Claude: quick entry & Sheets import ================= */
const MODNAME = { water: "Su", smoke: "Sigara", mood: "Keyif", pain: "Ağrı", steps: "Adım", sleep: "Uyku", stool: "Dışkı", metime: "Kişisel", screen: "Ekran", food: "Beslenme", exercise: "Spor", todo: "Görev", bill: "Ödeme", balance: "Bakiye", paid: "Ödendi" };
function opsSchema() {
  return `Return ONLY JSON: {"ops":[ ... ]}. Each op has "type", a short Turkish "label" for the user (e.g. "2 sigara", "Keyif sabah: 7", "Su +500 ml"), optional "date" (YYYY-MM-DD, the day it belongs to), optional "ref" (source row id) and these fields per type:
- water: {"ml": number}  (1 bardak = 250 ml, 1 şişe = 500 ml)
- smoke: {"count": number}
- mood: {"slot": "sabah"|"ogle"|"aksam", "score": 1-10}
- pain: {"slot": "sabah"|"ogle"|"aksam", "score": 0-10}
- steps: {"count": number}  (total steps for that day)
- sleep: {"bed": "HH:MM", "wake": "HH:MM"} or {"minutes": number}
- stool: {"bristol": 1-7 or null, "time": "HH:MM" optional}
- metime: {"minutes": number, "activity": "Okuma|Spor|Müzik|Yürüyüş|Oyun|Sosyal|Hobi|..."}  (hobbies / personal enjoyable time)
- screen: {"minutes": number}  (total phone screen time that day)
- food: {"meal": "Kahvaltı"|"Öğle"|"Akşam"|"Ara öğün", "name": string, "serving": string, "kcal": number, "protein": g, "carbs": g, "fat": g}  — one op per food item, decisive single estimates from USDA-style references or Turkish standard portions.
- exercise: {"name": string, "minutes": number, "kcal": number}  (estimate kcal if not given, using ~75 kg if unknown)
- todo: {"text": string, "list": "is"|"kisisel", "due": "YYYY-MM-DD" or null}
- bill: {"name": string, "kind": "fatura"|"kart"|"abonelik", "amount": number, "day": 1-31}  (a recurring monthly payment)
- balance: {"account": string, "kind": "banka"|"kart", "amount": number}  (current balance; for cards the current debt)
- paid: {"name": string}  (a bill was paid this month)
Rules: one op per fact; skip anything that fits no type; never invent data that was not said. Resolve relative dates ("dün", "yarın", "cuma") against today.`;
}
function contextLine() {
  const now = new Date();
  return `Today is ${todayKey()} (${now.toLocaleDateString("tr-TR", { weekday: "long" })}), time ${nowHM()}. Current time slot: ${slotNow()}. Default meal now: ${mealByTime()}.
Known accounts: ${S.fin.accounts.map(a => a.name).join(", ") || "none"}. Known bills: ${S.fin.bills.map(b => b.name).join(", ") || "none"}.`;
}
let qeCtl = null;
async function quickEntry() {
  const text = ($("#qe-text")?.value || "").trim(); ui.qe.text = text;
  if (!text) { ui.qe.err = "Bir şey yaz ya da dikte et."; render(); return; }
  ui.qe = { ...ui.qe, busy: true, err: "", ops: null, src: "text" }; render();
  qeCtl = new AbortController();
  try {
    const res = await sample.json(`You turn a Turkish personal-life log message into structured records for a life-tracking app. The selected day in the app is ${ui.day}; use it as "date" unless the message says otherwise.
${contextLine()}
${opsSchema()}

Message: ${text.slice(0, 4000)}`, { signal: qeCtl.signal, cache: false });
    ui.qe.ops = cleanOps(res?.ops, ui.day);
  } catch (e) { ui.qe.err = errMsg(e); if (e?.code === "not_granted") sample = null; }
  ui.qe.busy = false; render();
}
function cleanOps(ops, defDate) {
  return (Array.isArray(ops) ? ops : []).filter(o => o && MODNAME[o.type]).slice(0, 200).map(o => ({ ...o, date: validKey(o.date) || defDate }));
}
function errMsg(e) {
  return {
    cancelled: "", not_granted: "Bu sayfanın Claude'u kullanma izni yok.", sampling_disabled: "Bu hesapta Claude kullanılamıyor.",
    rate_limited: "Kullanım sınırına ulaştın. Biraz sonra tekrar dene.", invalid_json: "Claude'un cevabı okunamadı. Tekrar dene.",
    image_rejected: "Görsel okunamadı. JPEG ya da PNG dene.", session_expired: "Claude'a yeniden giriş yap.", refused: "Claude bu isteği işlemedi. Farklı ifade et.",
  }[e?.code] ?? "Claude'a ulaşılamadı. Tekrar dene.";
}
function applyOps(ops) {
  const touched = new Set(); let n = 0;
  for (const o of ops) {
    if (o._on === false) continue;
    const k = validKey(o.date) || ui.day, d = dayOf(k), dayDoc = "day_" + k;
    const s = slotKey(o.slot);
    switch (o.type) {
      case "water": d.water = Math.max(0, Math.round((d.water + num(o.ml) / 1000) * 100) / 100); touched.add(dayDoc); break;
      case "smoke": d.smoke = Math.max(0, d.smoke + r0(num(o.count) || 1)); touched.add(dayDoc); break;
      case "mood": d.mood[s] = clamp(r0(num(o.score)), 1, 10); touched.add(dayDoc); break;
      case "pain": d.pain[s] = clamp(r0(num(o.score)), 0, 10); touched.add(dayDoc); break;
      case "steps": d.steps = Math.max(0, r0(num(o.count))); touched.add(dayDoc); break;
      case "sleep": d.sleep = /^\d{1,2}:\d{2}$/.test(o.bed || "") && /^\d{1,2}:\d{2}$/.test(o.wake || "") ? { bed: o.bed.padStart(5, "0"), wake: o.wake.padStart(5, "0") } : num(o.minutes) ? { min: r0(num(o.minutes)) } : d.sleep; touched.add(dayDoc); break;
      case "stool": d.stool.push({ t: /^\d{1,2}:\d{2}$/.test(o.time || "") ? o.time : nowHM(), b: o.bristol ? clamp(r0(num(o.bristol)), 1, 7) : null }); touched.add(dayDoc); break;
      case "metime": d.me.push({ act: String(o.activity || "Kişisel zaman").slice(0, 30), min: Math.max(1, r0(num(o.minutes))) }); touched.add(dayDoc); break;
      case "screen": d.screen = Math.max(0, r0(num(o.minutes))); touched.add(dayDoc); break;
      case "food": d.items.push({ id: uid(), meal: mealTR(o.meal), name: String(o.name || "Yiyecek").slice(0, 80), serving: String(o.serving || "").slice(0, 40), kcal: Math.max(0, num(o.kcal)), p: Math.max(0, num(o.protein)), c: Math.max(0, num(o.carbs)), f: Math.max(0, num(o.fat)), src: "quick", at: Date.now() }); touched.add(dayDoc); break;
      case "exercise": d.ex.push({ id: uid(), name: String(o.name || "Spor").slice(0, 40), min: r0(num(o.minutes)), kcal: Math.max(0, r0(num(o.kcal))) }); touched.add(dayDoc); break;
      case "todo": if (o.text) { S.todos.push({ id: uid(), text: String(o.text).slice(0, 140), list: o.list === "is" ? "is" : "kisisel", due: validKey(o.due), done: false, doneAt: null, created: Date.now() }); touched.add("todos"); } break;
      case "bill": {
        if (!o.name) break;
        const ex = S.fin.bills.find(b => b.name.toLowerCase() === String(o.name).toLowerCase());
        const rec = { name: String(o.name).slice(0, 40), kind: ["fatura", "kart", "abonelik"].includes(o.kind) ? o.kind : "fatura", amount: num(o.amount), day: clamp(r0(num(o.day)) || 1, 1, 31) };
        if (ex) Object.assign(ex, rec); else S.fin.bills.push({ id: uid(), paid: {}, ...rec });
        touched.add("fin"); break;
      }
      case "balance": {
        if (!o.account) break;
        const ex = S.fin.accounts.find(a => a.name.toLowerCase() === String(o.account).toLowerCase());
        if (ex) Object.assign(ex, { balance: num(o.amount), updated: k });
        else S.fin.accounts.push({ id: uid(), name: String(o.account).slice(0, 40), kind: o.kind === "kart" ? "kart" : "banka", balance: num(o.amount), limit: 0, updated: k });
        touched.add("fin"); break;
      }
      case "paid": {
        const b = S.fin.bills.find(x => x.name.toLowerCase().includes(String(o.name || "").toLowerCase()) && o.name);
        if (b) { b.paid ||= {}; b.paid[ym(k)] = true; touched.add("fin"); } else continue;
        break;
      }
      default: continue;
    }
    if (o.ref) S.settings.imported.push(String(o.ref));
    n++;
  }
  if (S.settings.imported.length > 3000) S.settings.imported = S.settings.imported.slice(-3000);
  touched.add("profile");
  touched.forEach(persist);
  return n;
}

    const res = await mcp.callTool("Google Drive", "read_file_content", { fileId: id }, { cache: false });

  const seen = new Set(S.settings.imported);

Convert each row into ops. Use the row's "tarih" as "date" and its "id" as "ref". Only rows with tarih >= ${since}. Skip these already-imported ids: ${[...seen].slice(-400).join(",") || "none"}.
Column meanings: alan=su (deger ml), sigara (adet), keyif / agri (deger skor, not = sabah|ogle|aksam), adim (adım), uyku ("HH:MM-HH:MM" or minutes), diski (bristol or empty), kisisel (dk, not=aktivite), ekran (dk), spor (kcal, not=aktivite), yemek (deger=what was eaten → food ops, estimate), gorev (deger=task text, not=is|kisisel), odeme / bakiye / odendi, serbest (deger is free dictated Turkish text: parse it fully into any ops).
${contextLine()}
${opsSchema()}

SHEET TEXT:
${text.slice(-60000)}`, { signal: qeCtl.signal, cache: false });
    ui.qe.ops = cleanOps(res?.ops, todayKey()).filter(o => !o.ref || !seen.has(String(o.ref)));
    S.settings.lastImport = todayKey(); persist("profile");
  } catch (e) { ui.qe.err = errMsg(e); }

}

${ui.photo ? "- A photo of the meal is attached: identify each food and estimate portions from it." : ""}
- kcal ≈ protein*4 + carbs*4 + fat*9.

const encodeSave = () => "OS1." + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decodeSave(code) {
  const raw = code.trim().replace(/^(OS1|MT1)\./, "");
  const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
  if (!o || typeof o.days !== "object") throw new Error("bad");

function csv() {
  const head = ["tarih", "kalori", "protein_g", "karb_g", "yag_g", "spor_kcal", "su_l", "adim", "uyku_dk", "yatis", "kalkis", "sigara", "diski_adet", "keyif_sabah", "keyif_ogle", "keyif_aksam", "agri_sabah", "agri_ogle", "agri_aksam", "kisisel_dk", "ekran_dk", "biten_gorev"];
  const rows = Object.keys(S.days).sort().map(k => {
    const d = peek(k), f = food(k);
    return [k, r0(f.kcal), r0(f.p), r0(f.c), r0(f.f), burned(k), d.water, d.steps ?? "", sleepMin(d.sleep) ?? "", d.sleep?.bed || "", d.sleep?.wake || "", d.smoke, d.stool.length,
      d.mood.sabah ?? "", d.mood.ogle ?? "", d.mood.aksam ?? "", d.pain.sabah ?? "", d.pain.ogle ?? "", d.pain.aksam ?? "", meMin(k), d.screen ?? "", S.todos.filter(t => t.done && t.doneAt?.startsWith(k)).length];
  });
  return [head, ...rows].map(r => r.join(",")).join("\n");
}

  });
  on("#wrap", wrapSheet);
  on("#ex-add", () => { const name = $("#ex-name").value.trim(), kc = num($("#ex-kcal").value); if (!name || !kc) { toast("Aktivite adı ve kalori gir"); return; } dayOf(ui.day).ex.push({ id: uid(), name: name.slice(0, 40), min: r0(num($("#ex-min").value)), kcal: r0(kc) }); saveDay(`${name}: ${fmt(kc)} kcal`); });
  each("[data-delex]", b => { const d = dayOf(ui.day); d.ex = d.ex.filter(x => x.id !== b.dataset.delex); saveDay(); });
  // finance
  each("[data-acc]", b => accountSheet(b.dataset.acc));
  each("[data-bill]", b => billSheet(b.dataset.bill));
  each("[data-paid]", b => { const x = S.fin.bills.find(y => y.id === b.dataset.paid); if (!x) return; x.paid ||= {}; const m = ym(todayKey()); x.paid[m] = !x.paid[m]; persist("fin"); render(); toast(x.paid[m] ? `${x.name} ödendi` : `${x.name} ödenmedi`); });
  // todos
  each("[data-tlist]", b => { ui.newList = b.dataset.tlist; $$("[data-tlist]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const addTodo = () => { const t = $("#td-text").value.trim(); if (!t) return; S.todos.push({ id: uid(), text: t.slice(0, 140), list: ui.newList === "is" ? "is" : "kisisel", due: validKey($("#td-due").value), done: false, doneAt: null, created: Date.now() }); persist("todos"); render(); $("#td-text")?.focus(); };
  on("#td-add", addTodo); on("#td-text", e => { if (e.key === "Enter") addTodo(); }, "keydown");
  each("[data-tf]", b => { ui.todoFilter = b.dataset.tf; render(); });
  each("[data-done]", b => { const x = S.todos.find(y => y.id === b.dataset.done); if (!x) return; x.done = !x.done; x.doneAt = x.done ? `${todayKey()} ${nowHM()}` : null; persist("todos"); render(); if (x.done) toast("Tamamlandı ✓"); });
  each("[data-deltodo]", b => { const i = S.todos.findIndex(y => y.id === b.dataset.deltodo); if (i >= 0) { const [g] = S.todos.splice(i, 1); persist("todos"); render(); toast(`“${g.text.slice(0, 24)}” silindi`); } });
}

/* ================= clock & day rollover ================= */
let lastToday = todayKey();
function tick() {
  $("#clock").textContent = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  const t = todayKey();
  if (t !== lastToday) { if (ui.day === lastToday) { ui.day = t; ui.lastCal = 0; } lastToday = t; if (ui.view === "app") render(); }
}
setInterval(tick, 15000); tick();

/* ================= boot ================= */
(function boot() {
  const local = loadLocal();
  if (local) adopt(local);
  render();
  connectDb(); connectCaps();
})();
</script>
