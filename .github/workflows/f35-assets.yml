name: f35 varlıkları (Commons fotoğraf + derinlik)

# Bulut oturumu Wikimedia/HuggingFace'e erişemediği için fotoğraf adayları, seçilen fotoğraflar ve
# Depth Anything V2 Small derinlik katmanları burada üretilip aynı branch'e commit edilir.
on:
  push:
    paths:
      - 'arkaplan-remotion/tools/f35/assets.trigger'

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: arkaplan-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          npm ci --ignore-scripts
          pip install numpy pillow "opencv-python-headless<4.12"
      - name: Veri
        run: node tools/f35/data.mjs
      - name: Adaylar ya da seçili fotoğraflar
        run: |
          MODE=$(head -1 tools/f35/assets.trigger | cut -d" " -f1)
          if [ "$MODE" = "candidates" ]; then
            python tools/f35/fetch_photos.py --candidates 8
          else
            python tools/f35/fetch_photos.py
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install transformers
            python tools/f35/depth.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          for p in public/photos public/depth src/data/f35.assets.json; do [ -e "$p" ] && git add -f "$p"; done
          git commit -m "f35: Commons fotoğrafları / derinlik ($(head -1 tools/f35/assets.trigger)) [skip ci]" || echo "değişiklik yok"
          git pull --rebase -q || true; git push
